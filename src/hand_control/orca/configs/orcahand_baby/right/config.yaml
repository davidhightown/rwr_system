- wrist
- thumb_cmc
- thumb_abd
- thumb_mcp
- thumb_dip
- index_abd
- index_mcp
- index_pip
- middle_abd
- middle_mcp
- middle_pip
- ring_abd
- ring_mcp
- ring_pip
- pinky_abd
- pinky_mcp
- pinky_pip
joint_to_motor_map:
  # motor: tendon pair (Nr. top / bottom spool)
  thumb_cmc: 17     # T-TP: flex 15 top / ext 14 bottom   (T-TP = cmc assumed)
  thumb_abd: 4      # T-AP: L 17 top / R 20 bottom
  thumb_mcp: -16    # T-PP: flex 16 top / ext 13 bottom
  thumb_dip: 5      # T-DP: flex 18 top / ext 19 bottom   (reversed on the hand: +5, seen 27 Nov)
  index_abd: 15     # I-AP: L 11 top / R 12 bottom
  index_mcp: -3     # I-PP: flex 24 top / ext 21 bottom
  index_pip: 2      # I-DP: ext 23 top / flex 22 bottom   (flex on the bottom spool)
  middle_abd: -6    # M-AP: R 25 top / L 26 bottom
  middle_mcp: -13   # M-PP: flex 7 top / ext 8 bottom
  middle_pip: -14   # M-DP: flex 10 top / ext 9 bottom
  ring_abd: 7       # R-AP: L 32 top / R 27 bottom
  ring_mcp: -9      # R-PP: flex 30 top / ext 29 bottom
  ring_pip: 8       # R-DP: ext 31 top / flex 28 bottom   (flex on the bottom spool)
  pinky_abd: -12    # P-AP: R 6 top / L 1 bottom
  pinky_mcp: 10     # P-PP: ext 4 top / flex 3 bottom     (flex on the bottom spool)
  pinky_pip: -11    # P-DP: flex 5 top / ext 2 bottom
  wrist: -1
