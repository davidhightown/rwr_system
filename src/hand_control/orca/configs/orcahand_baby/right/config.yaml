# Stalls every joint into its hardstops (the wrist too). 600 mA was too weak with the tightened tendons; 800 mA worked
# (calibrations of 23 Nov). For one run: calibration_current_ma:=... of the controller launch. 900 for the retry of a
# joint that stopped short (only with a joint_motor_travel baseline). Also tensioning_v2.py's winding current, as on the
# full-size hand, so the tendons are wound taut under the load calibration drives the joints into their end stops with.
calibration_current: 800
calibration_retry_current: 900
# Slower than the full-size hand's 0.15 rad / 0.0001 s (motors at nearly full speed, too fast for the small joints):
# the goal goes 0.08 rad ahead of the motor every 50 ms, at most ~1.6 rad/s (90 deg/s) of motor shaft. If joints stop
# short of their hardstops (short-travel warnings), raise the step size a little, e.g. 0.1.
calibration_step_size: 0.08
calibration_step_period: 0.05
calibration_num_stable: 10
calibration_threshold: 0.01
# The full-size hand's sequence.
calibration_sequence:
- step: 1
  joints:
    thumb_cmc: flex
- step: 2
  joints:
    thumb_cmc: extend
- step: 3
  joints:
    thumb_abd: flex
- step: 4
  joints:
    thumb_abd: extend
- step: 5
  joints:
    thumb_mcp: flex
- step: 6
  joints:
    thumb_mcp: extend
- step: 7
  joints:
    thumb_dip: flex
- step: 8
  joints:
    thumb_dip: extend
- step: 9
  joints:
    index_abd: flex
    middle_abd: flex
    ring_abd: flex
    pinky_abd: flex
- step: 10
  joints:
    index_abd: extend
    middle_abd: extend
    ring_abd: extend
    pinky_abd: extend
- step: 11
  joints:
    index_mcp: flex
    middle_mcp: flex
    ring_mcp: flex
    pinky_mcp: flex
- step: 12
  joints:
    index_mcp: extend
    middle_mcp: extend
    ring_mcp: extend
    pinky_mcp: extend
- step: 13
  joints:
    index_pip: flex
    middle_pip: flex
    ring_pip: flex
    pinky_pip: flex
- step: 14
  joints:
    index_pip: extend
    middle_pip: extend
    ring_pip: extend
    pinky_pip: extend
- step: 15
  joints:
    wrist: flex
- step: 16
  joints:
    wrist: extend
