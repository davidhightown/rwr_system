# down at the palm, AprilTag tag36h11 ID 9 (black square 0.075 m) lying flat on the table beyond the fingertips.
#
#   python experiments/rl_inference/eval_policies.py --models-dir models_extero \
#       --calibration experiments/cfgs/calibration/camera_extrinsics_2026-11-12.npy \
#       --hand-to-tag 0 -0.109 0.320 90 0 0 --cube-pose-timeout 0.5
